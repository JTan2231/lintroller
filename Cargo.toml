[package]
name = "lintroller"
version = "0.1.0"
edition = "2024"
description = "Find unreferenced Swift declarations in a compiler index store"

[[bin]]
name = "lintroller"
path = "src/main.rs"
test = false

[dependencies]
clap = { version = "4.5", features = ["derive"] }
tree-sitter = "0.26"
tree-sitter-swift = "0.7.4"
