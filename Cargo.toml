[package]
name = "lintroller"
version = "0.1.0"
edition = "2024"
description = "Lint Swift source and compiler index records with SwiftLint rules"

[[bin]]
name = "lintroller"
path = "src/main.rs"
test = false

[dependencies]
clap = { version = "4.5", features = ["derive"] }
tree-sitter = "0.26"
tree-sitter-swift = "0.7.4"
unicode-segmentation = "1"
